name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          curl -s https://ifconfig.me; echo
          python -u diag_hops.py https://sede.uco.es/bouco/
          curl -s -o /dev/null -m 20 http://sede.uco.es/bouco/bandejaAnuncios.htm -w "http bandeja code=%{http_code} t=%{time_total}\n" || echo "http bandeja fail $?"
          curl -s -o /dev/null -m 20 https://sede.uco.es/bouco/bandejaAnuncios.htm -w "https bandeja code=%{http_code} t=%{time_total}\n" || echo "https bandeja fail $?"
      - run: timeout 900 python -u scraper.py || echo "scraper rc=$?"

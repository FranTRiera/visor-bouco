name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://ifconfig.me; echo
          for ua in "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36" "bouco-visor/1.0"; do
            curl -s -o /dev/null -m 30 -A "$ua" -w "UA=$ua code=%{http_code} t=%{time_total} connect=%{time_connect}\n" https://sede.uco.es/bouco/ || echo "fail $?"
          done
          curl -s -o /dev/null -m 30 -w "uco.es code=%{http_code}\n" https://www.uco.es/ || echo "uco.es fail $?"
          curl -s -o /dev/null -m 30 -w "sede http code=%{http_code}\n" http://sede.uco.es/ || echo "sede http fail $?"

name: Actualizar BOUCO

on:
  schedule:
    # Lunes a viernes a las 8:30, 13:30 y 19:30 (hora peninsular, UTC+1 en invierno)
    - cron: "30 7,12,18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-bouco
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar anuncios nuevos
        run: python scraper.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bouco.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "datos: actualización automática del BOUCO"
            git push
          fi

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor BOUCO</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --line: #dfe3e8;
    --accent: #006241; --accent-soft: #e3f1ea; --chip: #eef1f4; --mark: #fff1a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1b2129; --text: #e6e9ed; --muted: #9aa5b1; --line: #2c343f;
      --accent: #4cc38a; --accent-soft: #1d3a2d; --chip: #252d37; --mark: #5a4d00;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--accent); color: #fff; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  header h1 { margin: 0; font-size: 20px; }
  header small { opacity: .85; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1300px; margin: 0 auto; padding: 20px; }
  aside { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .filter { margin-bottom: 16px; }
  .filter > label, .filter > .label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  input[type=search], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .7; margin-left: 4px; font-size: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.reset { width: 100%; padding: 8px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font: inherit; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .count { font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card h2 { font-size: 16px; margin: 4px 0 6px; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .desc { margin: 6px 0 8px; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 5px; background: var(--chip); }
  .tag.conv { background: var(--accent-soft); }
  .tag.area { border: 1px solid var(--accent); }
  mark { background: var(--mark); color: inherit; }
  .pager { display: flex; gap: 6px; justify-content: center; margin: 16px 0; }
  .pager button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  #toggleFilters { display: none; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 12px 16px; }
    aside { position: static; max-height: none; display: none; }
    aside.open { display: block; }
    #toggleFilters { display: inline-block; }
  }
</style>
</head>
<body>
<header>
  <h1>Visor del BOUCO</h1>
  <small id="updated"></small>
</header>
<div class="layout">
  <aside id="filters">
    <div class="filter">
      <label for="q">Buscar texto</label>
      <input type="search" id="q" placeholder="p. ej. sustituto, Erasmus, 2026/01190">
    </div>
    <div class="filter">
      <div class="label">Tipo de convocatoria</div>
      <div class="chips" id="convChips"></div>
    </div>
    <div class="filter">
      <label for="area">Área de conocimiento</label>
      <input type="search" id="area" list="areaList" placeholder="Escribe o elige un área">
      <datalist id="areaList"></datalist>
    </div>
    <div class="filter">
      <label for="fase">Fase</label>
      <select id="fase"></select>
    </div>
    <div class="filter">
      <label for="tema">Sección del BOUCO</label>
      <select id="tema"></select>
    </div>
    <div class="filter">
      <label for="dept">Departamento</label>
      <select id="dept"></select>
    </div>
    <div class="filter">
      <div class="label">Fecha de publicación</div>
      <div class="row2">
        <input type="search" id="desde" placeholder="desde AAAA-MM-DD" aria-label="Desde">
        <input type="search" id="hasta" placeholder="hasta AAAA-MM-DD" aria-label="Hasta">
      </div>
      <div class="chips" style="margin-top:8px" id="yearChips"></div>
    </div>
    <button class="reset" id="reset">Quitar filtros</button>
  </aside>
  <main>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <span>
        <button class="chip" id="toggleFilters">Filtros</button>
        <button class="chip" id="csv">Exportar CSV</button>
      </span>
    </div>
    <div id="results"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<script src="data/bouco-data.js"></script>
<script>
(async () => {
  const PAGE_SIZE = 30;
  const $ = (id) => document.getElementById(id);

  // En local (doble clic) se usa data/bouco-data.js; en la web, data/bouco.json
  let data = window.BOUCO_DATA;
  if (!data && location.protocol.startsWith('http')) {
    $('results').innerHTML = '<div class="empty">Cargando anuncios…</div>';
    try {
      const resp = await fetch('data/bouco.json', { cache: 'no-cache' });
      if (resp.ok) data = await resp.json();
    } catch (err) {
      console.error('No se pudo cargar data/bouco.json', err);
    }
  }
  if (!data || !data.anuncios) {
    $('results').innerHTML = '<div class="empty">No hay datos. Ejecuta <code>python scraper.py</code> para descargarlos.</div>';
    return;
  }

  const norm = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const ads = data.anuncios.map((a) => ({
    ...a,
    year: a.fecha.slice(0, 4),
    temaKey: a.tema ? `${a.tema} › ${a.subtema || 'General'}` : 'Sin clasificar',
    hay: norm(`${a.id} ${a.titulo} ${a.descripcion} ${a.departamento} ${a.areas.join(' ')}`),
  }));
  $('updated').textContent = `${ads.length.toLocaleString('es')} anuncios · comprobado ${data.comprobado || data.actualizado} · último cambio ${data.actualizado}`;

  const state = { q: '', conv: new Set(), area: '', fase: '', tema: '', dept: '', desde: '', hasta: '', year: '', page: 1 };

  const tally = (list, keyFn) => {
    const m = new Map();
    list.forEach((a) => [].concat(keyFn(a)).forEach((k) => k && m.set(k, (m.get(k) || 0) + 1)));
    return m;
  };
  const fillSelect = (el, counts, allLabel, sortByName = true) => {
    const entries = [...counts.entries()].sort(sortByName ? (a, b) => a[0].localeCompare(b[0], 'es') : (a, b) => b[1] - a[1]);
    el.innerHTML = `<option value="">${allLabel}</option>` +
      entries.map(([k, n]) => `<option value="${esc(k)}">${esc(k)} (${n})</option>`).join('');
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Opciones estáticas
  const convCounts = tally(ads, (a) => a.convocatorias);
  const convOrder = [...convCounts.keys()].sort((a, b) => (a === 'Otros') - (b === 'Otros') || convCounts.get(b) - convCounts.get(a));
  $('convChips').innerHTML = convOrder.map((c) =>
    `<button class="chip" data-conv="${esc(c)}" aria-pressed="false">${esc(c)}<span class="n">${convCounts.get(c)}</span></button>`).join('');
  fillSelect($('fase'), tally(ads, (a) => a.fase), 'Todas las fases');
  fillSelect($('tema'), tally(ads, (a) => a.temaKey), 'Todas las secciones');
  fillSelect($('dept'), tally(ads, (a) => a.departamento), 'Todos los departamentos');
  const areaCounts = tally(ads, (a) => a.areas);
  $('areaList').innerHTML = [...areaCounts.keys()].sort((a, b) => a.localeCompare(b, 'es'))
    .map((k) => `<option value="${esc(k)}">${areaCounts.get(k)} anuncios</option>`).join('');
  const years = [...new Set(ads.map((a) => a.year))].sort().reverse();
  $('yearChips').innerHTML = years.map((y) => `<button class="chip" data-year="${y}" aria-pressed="false">${y}</button>`).join('');

  function matches(a) {
    if (state.conv.size && !a.convocatorias.some((c) => state.conv.has(c))) return false;
    if (state.fase && a.fase !== state.fase) return false;
    if (state.tema && a.temaKey !== state.tema) return false;
    if (state.dept && a.departamento !== state.dept) return false;
    if (state.year && a.year !== state.year) return false;
    if (state.desde && a.fecha < state.desde) return false;
    if (state.hasta && a.fecha > state.hasta) return false;
    if (state.area) {
      const t = norm(state.area);
      if (!a.areas.some((x) => norm(x).includes(t)) && !a.hay.includes(t)) return false;
    }
    if (state.q) {
      const terms = norm(state.q).split(/\s+/).filter(Boolean);
      if (!terms.every((t) => a.hay.includes(t))) return false;
    }
    return true;
  }

  function highlight(text) {
    const terms = [state.q, state.area].flatMap((s) => norm(s).split(/\s+/)).filter((t) => t.length > 1);
    let out = esc(text);
    if (!terms.length) return out;
    const normOut = norm(out);
    const marks = [];
    terms.forEach((t) => { let i = normOut.indexOf(t); while (i >= 0) { marks.push([i, i + t.length]); i = normOut.indexOf(t, i + t.length); } });
    let lastStart = Infinity;
    marks.sort((x, y) => y[0] - x[0]).forEach(([s, e]) => {
      if (e > lastStart) return; // evita marcas solapadas
      out = out.slice(0, s) + '<mark>' + out.slice(s, e) + '</mark>' + out.slice(e);
      lastStart = s;
    });
    return out;
  }

  let current = [];
  function render() {
    current = ads.filter(matches);
    const pages = Math.max(1, Math.ceil(current.length / PAGE_SIZE));
    state.page = Math.min(state.page, pages);
    $('count').textContent = `${current.length.toLocaleString('es')} anuncios`;
    const slice = current.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
    $('results').innerHTML = slice.length ? slice.map(card).join('') : '<div class="empty">Ningún anuncio coincide con los filtros.</div>';
    $('pager').innerHTML = pages > 1 ? `
      <button data-p="1" ${state.page === 1 ? 'disabled' : ''}>«</button>
      <button data-p="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>‹</button>
      <span style="padding:6px">Página ${state.page} de ${pages}</span>
      <button data-p="${state.page + 1}" ${state.page === pages ? 'disabled' : ''}>›</button>
      <button data-p="${pages}" ${state.page === pages ? 'disabled' : ''}>»</button>` : '';
    document.querySelectorAll('[data-conv]').forEach((b) => b.setAttribute('aria-pressed', state.conv.has(b.dataset.conv)));
    document.querySelectorAll('[data-year]').forEach((b) => b.setAttribute('aria-pressed', state.year === b.dataset.year));
    saveHash();
  }

  function card(a) {
    const [y, m, d] = a.fecha.split('-');
    return `<article class="card">
      <div class="meta"><span>N.º ${esc(a.id)}</span><span>${d}/${m}/${y}</span><span>${esc(a.temaKey)}</span><span>${esc(a.fase)}</span></div>
      <h2><a href="${esc(a.url)}" target="_blank" rel="noopener">${highlight(a.titulo)}</a></h2>
      <p class="desc">${highlight(a.descripcion)}</p>
      <div class="tags">
        ${a.convocatorias.map((c) => `<span class="tag conv">${esc(c)}</span>`).join('')}
        ${a.areas.map((x) => `<span class="tag area">${esc(x)}</span>`).join('')}
        ${a.departamento ? `<span class="tag">Dpto. ${esc(a.departamento)}</span>` : ''}
      </div>
    </article>`;
  }

  // Estado en la URL (#...) para poder guardar o compartir búsquedas
  function saveHash() {
    const p = new URLSearchParams();
    ['q', 'area', 'fase', 'tema', 'dept', 'desde', 'hasta', 'year'].forEach((k) => state[k] && p.set(k, state[k]));
    if (state.conv.size) p.set('conv', [...state.conv].join('|'));
    if (state.page > 1) p.set('page', state.page);
    history.replaceState(null, '', '#' + p.toString());
  }
  function loadHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    ['q', 'area', 'fase', 'tema', 'dept', 'desde', 'hasta', 'year'].forEach((k) => { state[k] = p.get(k) || ''; });
    state.conv = new Set((p.get('conv') || '').split('|').filter(Boolean));
    state.page = +p.get('page') || 1;
    ['q', 'area', 'fase', 'tema', 'dept', 'desde', 'hasta'].forEach((k) => { $(k).value = state[k]; });
  }

  const bind = (id, key, ev = 'input') => $(id).addEventListener(ev, (e) => { state[key] = e.target.value.trim(); state.page = 1; render(); });
  bind('q', 'q'); bind('area', 'area'); bind('fase', 'fase', 'change'); bind('tema', 'tema', 'change');
  bind('dept', 'dept', 'change'); bind('desde', 'desde'); bind('hasta', 'hasta');
  $('convChips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-conv]'); if (!b) return;
    const c = b.dataset.conv; state.conv.has(c) ? state.conv.delete(c) : state.conv.add(c); state.page = 1; render();
  });
  $('yearChips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-year]'); if (!b) return;
    state.year = state.year === b.dataset.year ? '' : b.dataset.year; state.page = 1; render();
  });
  $('pager').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]'); if (!b || b.disabled) return;
    state.page = +b.dataset.p; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('reset').addEventListener('click', () => { location.hash = ''; loadHash(); render(); });
  $('toggleFilters').addEventListener('click', () => $('filters').classList.toggle('open'));
  $('csv').addEventListener('click', () => {
    const cols = ['id', 'fecha', 'titulo', 'descripcion', 'tema', 'subtema', 'fase', 'convocatorias', 'areas', 'departamento', 'url'];
    const cell = (v) => '"' + String(Array.isArray(v) ? v.join('; ') : v ?? '').replace(/"/g, '""') + '"';
    const csv = '﻿' + [cols.join(';'), ...current.map((a) => cols.map((c) => cell(a[c])).join(';'))].join('\r\n');
    const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: 'bouco-filtrado.csv' });
    link.click(); URL.revokeObjectURL(link.href);
  });

  loadHash();
  render();
})();
</script>
</body>
</html>
